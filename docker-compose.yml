version: '3.8'

services:
  # ==============================================================================
  # 1. PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cfms_postgres
    restart: always
    environment:
      POSTGRES_DB: college_feedback_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d college_feedback_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. Spring Boot 3.3.3 Backend Service
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cfms_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: college_feedback_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:80,http://127.0.0.1:80
    ports:
      - "8081:8081"

  # ==============================================================================
  # 3. Static Web Frontend (Nginx)
  # ==============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfms_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
    driver: local
